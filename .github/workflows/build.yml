---
name: Build, Test and Publish

on:
  push:
    branches:
      - develop
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'  # Matches semver tags like 1.2.3 or 1.2.3-alpha
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      - name: Lint with pre-commit
        run: uvx pre-commit run --all-files

      - name: Run tests
        run: uv run --frozen pytest tests -v

      - name: Check with ruff
        run: uvx ruff check src/

  build-publish:
    name: Build and Publish
    needs: lint-test
    runs-on: ubuntu-latest
    # Only run on PR commits, develop branch commits, and tags
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Publish to Test PyPI (on PR commits)
        if: github.event_name == 'pull_request'
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --trusted-publishing always

      - name: Publish to Test PyPI (on develop commits)
        if: github.ref == 'refs/heads/develop'
        run: |
          uv publish \
            --publish-url https://test.pypi.org/legacy/ \
            --trusted-publishing always

      - name: Publish to PyPI (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv publish \
            --trusted-publishing always
